server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location /healthz {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }

  # The SPA talks same-origin (/api/v1, /auth, /ws, /capabilities — see
  # apps/web/src/lib/api-client.ts + stores/use-capabilities.ts), so nginx
  # must reverse-proxy those prefixes to the API container. Without these
  # blocks every login/API call inside the compose stack answers 405/404 from
  # the static server.
  location /api/ {
    proxy_pass http://api:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # `/capabilities` is mounted at the API's ROOT (not under /api/v1), and
  # `useCapabilities` fetches it same-origin with an empty axios baseURL.
  # Without this block the SPA fallback served index.html for it — the
  # guard in the store turned that into an error state, and the header LLM
  # badge was stuck on "LLM not connected" even when the backend reported
  # status:ready (capability.changed WS refetches hit the same wall).
  location /capabilities {
    proxy_pass http://api:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /auth/ {
    proxy_pass http://api:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /ws {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
